<script>
// NAI stealth-PNG metadata reader + eraser format reverse-engineered from
// NovelAIs own open-source nai_meta.py if its broken, can be fixed by redoing the 1st step /// keep for now :----------

// what every erased prompt line gets replaced with (base, negative, each character prompt/negative).
// plain ASCII on purpose — it also goes into PNG tEXt chunks, which are latin-1 only.
const NOTICE_TEXT = "This image's metadata was removed via rwyn.app/tools/MetadataInspector.html";

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const statusMsg = document.getElementById('statusMsg');
const notesMsg = document.getElementById('notesMsg');

const negPromptGroup = document.getElementById('negPromptGroup');

const negPromptEl = document.getElementById('negPrompt');
const charListEl = document.getElementById('charList');
const detailsGroup = document.getElementById('detailsGroup');
const detailsGrid = document.getElementById('detailsGrid');
const imageActions = document.getElementById('imageActions');
const eraseBtn = document.getElementById('eraseBtn');
const clearBtn = document.getElementById('clearBtn');
const newImageBtn = document.getElementById('newImageBtn');

const workCanvas = document.createElement('canvas');
const ctx = workCanvas.getContext('2d', {willReadFrequently:true});
let currentFileBase = 'image';
let lastParsed = null; // {comment, fields} of the image currently loaded; null if it had no NAI metadata

const NO_CHAR_HTML = '<div class="field-group no-char-box"><div class="no-char">NO CHARACTER FOUND</div></div>';

function setStatus(msg, type){

  statusMsg.className = 'status-msg' + (type ? ' '+type : '');
}

function loadImageEl(url){

    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = url;

}

async function extractStealthPng(imageData, width, height){
  const total = width*height;
  const bits = new Uint8Array(total);
  let i = 0;
  for(let x=0; x<width; x++){
    for(let y=0; y<height; y++){
      bits[i++] = imageData.data[(y*width+x)*4 + 3] & 1;
    }
  }
  const usableBits = Math.floor(total/8)*8;
  const byteCount = usableBits/8;
  const bytes = new Uint8Array(byteCount);
  for(let b=0; b<byteCount; b++){
    let v = 0;
    for(let k=0; k<8; k++) v = (v<<1) | bits[b*8+k];
    bytes[b] = v;
  }

  let pos = 0;
  const next = n => { const s = bytes.slice(pos, pos+n); pos += n; return s; };

  const magic = new TextDecoder('utf-8').decode(next(15));
  if(magic !== 'stealth_pngcomp') throw new Error('no stealth metadata (magic mismatch)');

  const lenBytes = next(4);
  if(lenBytes.length !== 4) throw new Error('truncated length field');
  const lenBits = lenBytes[0]*16777216 + (lenBytes[1]<<16) + (lenBytes[2]<<8) + lenBytes[3];
  const payload = next(Math.floor(lenBits/8));

  if(!window.DecompressionStream) throw new Error('this browser lacks DecompressionStream (gzip) support');
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([payload]).stream().pipeThrough(ds);
  const gunzipped = new Uint8Array(await new Response(stream).arrayBuffer());
  const data = JSON.parse(new TextDecoder('utf-8').decode(gunzipped));

  if(typeof data.Comment === 'string'){
    try{ data.Comment = JSON.parse(data.Comment); } catch(e){ /* leave as raw string */ }
  }
  return data;
}

// ---------- writer side: the exact mirror of extractStealthPng above ----------
// layout = 'stealth_pngcomp' (15 bytes) + payload length in BITS (4 bytes, big-endian) + gzip(JSON),
// written MSB-first into the alpha channel's lowest bit, column by column (x outer, y inner).
// alpha becomes 254|bit, so it stays visually opaque. everything past the payload stays 255.
async function embedStealth(imageData, width, height, outerObj){
  if(!window.CompressionStream) throw new Error('this browser lacks CompressionStream (gzip) support');
  const json = new TextEncoder().encode(JSON.stringify(outerObj));
  const cs = new CompressionStream('gzip');
  const gz = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer());

  const payload = new Uint8Array(15 + 4 + gz.length);
  payload.set(new TextEncoder().encode('stealth_pngcomp'), 0);
  const lenBits = gz.length * 8;
  payload[15] = (lenBits >>> 24) & 255;
  payload[16] = (lenBits >>> 16) & 255;
  payload[17] = (lenBits >>> 8) & 255;
  payload[18] = lenBits & 255;
  payload.set(gz, 19);

  const totalBits = payload.length * 8;
  if(totalBits > width*height) throw new Error('image is too small to hold the notice');

  const d = imageData.data;
  for(let k=0; k<totalBits; k++){
    const bit = (payload[k >> 3] >> (7 - (k & 7))) & 1;
    const x = Math.floor(k / height), y = k % height;
    d[(y*width + x)*4 + 3] = 254 | bit;
  }
}

// plain PNG tEXt chunks (what NAI also writes next to the stealth data) so viewers that only read
// the text chunks show the notice too. needs a crc32 since chunks are checksummed.
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0; n<256; n++){
    let c = n;
    for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function latin1Bytes(s){ return Uint8Array.from(s, ch => ch.charCodeAt(0) & 255); }
function makeTextChunk(key, value){
  const k = latin1Bytes(key), v = latin1Bytes(value);
  const data = new Uint8Array(k.length + 1 + v.length);
  data.set(k, 0); data[k.length] = 0; data.set(v, k.length + 1);
  const type = latin1Bytes('tEXt');
  const chunk = new Uint8Array(12 + data.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(type, 4);
  chunk.set(data, 8);
  const crcInput = new Uint8Array(4 + data.length);
  crcInput.set(type, 0); crcInput.set(data, 4);
  dv.setUint32(8 + data.length, crc32(crcInput));
  return chunk;
}
function insertTextChunks(png, chunks){
  const dv = new DataView(png.buffer, png.byteOffset, png.byteLength);
  let off = 8; // skip the PNG signature, then walk chunks until the first IDAT
  while(off + 8 <= png.length){
    const len = dv.getUint32(off);
    const type = String.fromCharCode(png[off+4], png[off+5], png[off+6], png[off+7]);
    if(type === 'IDAT') break;
    off += 12 + len;
  }
  const extra = chunks.reduce((n,c)=> n + c.length, 0);
  const out = new Uint8Array(png.length + extra);
  out.set(png.subarray(0, off), 0);
  let p = off;
  chunks.forEach(c=>{ out.set(c, p); p += c.length; });
  out.set(png.subarray(off), p);
  return out;
}

// rebuilds the metadata with the same shape as the original (v4 captions, character slots, legacy prompt/uc)
// but every prompt line that actually had content now holds NOTICE_TEXT; empty ones stay empty.
// seed / sampler / steps / scale / model are simply dropped, so nothing about the generation survives.
function buildNotice(comment, fields){
  const N = NOTICE_TEXT;
  const c = {};
  if(fields.basePrompt) c.prompt = N;
  if(fields.negPrompt) c.uc = N;
  if(comment.v4_prompt && comment.v4_prompt.caption){
    c.v4_prompt = { caption: {
      base_caption: fields.basePrompt ? N : '',
      char_captions: fields.characters.map(ch => ({ char_caption: ch.prompt ? N : '' }))
    }};
    c.v4_negative_prompt = { caption: {
      base_caption: fields.negPrompt ? N : '',
      char_captions: fields.characters.map(ch => ({ char_caption: ch.negative ? N : '' }))
    }};
  }
  const outer = {
    Title: 'NovelAI generated image',
    Description: N,
    Software: 'NovelAI',
    Comment: JSON.stringify(c)
  };
  const textChunks = ['Title','Description','Software','Comment'].map(k => makeTextChunk(k, outer[k]));
  return {outer, textChunks};
}

function parsePngTextChunks(buffer){
  const view = new DataView(buffer);
  const out = {};
  let offset = 8;
  while(offset + 8 <= buffer.byteLength){
    const length = view.getUint32(offset); offset += 4;
    const type = String.fromCharCode(view.getUint8(offset),view.getUint8(offset+1),view.getUint8(offset+2),view.getUint8(offset+3)); offset += 4;
    if(type === 'tEXt'){
      const bytes = new Uint8Array(buffer, offset, length);
      const nul = bytes.indexOf(0);
      if(nul !== -1){
        const key = new TextDecoder('latin1').decode(bytes.slice(0,nul));
        const val = new TextDecoder('latin1').decode(bytes.slice(nul+1));
        out[key] = val;
      }
    }
    offset += length + 4;
    if(type === 'IEND') break;
  }
  return out;
}

function extractFields(comment){
  const v4p = comment.v4_prompt && comment.v4_prompt.caption;
  const v4n = comment.v4_negative_prompt && comment.v4_negative_prompt.caption;
  const basePrompt = (v4p && v4p.base_caption) || comment.prompt || '';
  const negPrompt = (v4n && v4n.base_caption) || comment.uc || '';
  let characters = [];
  const charCaps = v4p && v4p.char_captions;
  if(Array.isArray(charCaps) && charCaps.length){
    const negCaps = (v4n && v4n.char_captions) || [];
    characters = charCaps.map((c,idx)=>({
      prompt: c.char_caption || '',
      negative: (negCaps[idx] && negCaps[idx].char_caption) || ''
    }));
  }
  return {basePrompt, negPrompt, characters};
}

// each field only renders if it actually has content — lots of people leave character negative prompts
// (and sometimes the base ones) empty, and an empty box just looked broken. if ANY field got skipped for
// being empty, a single generic note appears under the status line instead of one line per missing field
// (a 4-character image with all-empty negatives used to print 4 near-identical lines, which was worse noise
// than the empty boxes it was replacing).
function renderFields(fields, comment, outer){
  let anyMissing = false;

  if(fields.basePrompt){
    basePromptGroup.style.display = '';
    basePromptEl.value = fields.basePrompt;
  } else {
    basePromptGroup.style.display = 'none';
    anyMissing = true;
  }

  if(fields.negPrompt){
    negPromptGroup.style.display = '';
    negPromptEl.value = fields.negPrompt;
  } else {
    negPromptGroup.style.display = 'none';
    anyMissing = true;
  }

  charListEl.innerHTML = '';
  if(fields.characters.length){
    fields.characters.forEach((c,i)=>{
      const hasPrompt = !!c.prompt;
      const hasNeg = !!c.negative;
      if(!hasPrompt && !hasNeg) return; // this character slot had nothing at all, skip it entirely
      if(!hasPrompt || !hasNeg) anyMissing = true;

      const block = document.createElement('div');
      block.className = 'field-group';
      block.style.padding = '10px 12px';
      let html = '';

      if(hasPrompt){
        html += `<div class="field-head"><label>Character ${i+1} — Prompt</label></div><textarea readonly style="min-height:80px;">${c.prompt}</textarea>`;
      }
      if(hasNeg){
        html += `<div class="field-head" style="margin-top:${hasPrompt?'8px':'0'};"><label>Character ${i+1} — Negative</label></div><textarea readonly style="min-height:56px;">${c.negative}</textarea>`;
      }

      block.innerHTML = html;
      charListEl.appendChild(block);
    });
    if(!charListEl.children.length) charListEl.innerHTML = NO_CHAR_HTML;
  } else {
    charListEl.innerHTML = NO_CHAR_HTML;
  }

  const details = {
    Model: (outer && outer.Source) || comment.model,
    Sampler: comment.sampler,
    Steps: comment.steps,
    Seed: comment.seed,
    Scale: comment.scale
  };
  const rows = Object.entries(details).filter(([,v]) => v !== undefined && v !== null && v !== '');
  if(rows.length){
    detailsGrid.innerHTML = rows.map(([k,v]) => `<div><b>${k}:</b>${v}</div>`).join('');
    detailsGroup.style.display = '';
  } else {
    detailsGroup.style.display = 'none';
  }

  if(anyMissing){
    notesMsg.textContent = 'Some prompt fields on this image are empty, so they\'re left out above.';
    notesMsg.style.display = '';
  } else {
    notesMsg.textContent = '';
    notesMsg.style.display = 'none';
  }
}

function clearFields(){
  lastParsed = null;
  basePromptEl.value = '';
  negPromptEl.value = '';
  basePromptGroup.style.display = '';
  negPromptGroup.style.display = '';
  charListEl.innerHTML = NO_CHAR_HTML;
  detailsGroup.style.display = 'none';
  notesMsg.textContent = '';
  notesMsg.style.display = 'none';
}

function clearImage(){
  dropZone.innerHTML = '<div class="drop-hint" id="dropHint"><span class="big">&#8613;</span>Click or drop a NovelAI PNG here</div>';
  imageActions.style.display = 'none';
  clearFields();
  setStatus('You upload a PNG, I read the metadata — everything runs in your browser, never sent to any server.', '');
  workCanvas.width = 0; workCanvas.height = 0;
  currentFileBase = 'image';
}

async function handleFile(file){
  if(!/png$/i.test(file.type) && !/\.png$/i.test(file.name)){
    setStatus('Only PNG is supported. NAI doesn\'t embed JPG files.', 'error');
    return;
  }
  currentFileBase = file.name.replace(/\.png$/i, '');
  setStatus('Reading…');
  clearFields();

  const arrayBuffer = await file.arrayBuffer();
  const objectUrl = URL.createObjectURL(file);
  const img = await loadImageEl(objectUrl);

  workCanvas.width = img.naturalWidth;
  workCanvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  dropZone.innerHTML = '';
  dropZone.appendChild(img);
  img.style.maxWidth = '100%';
  img.style.maxHeight = '100%';
  img.style.objectFit = 'contain';
  img.style.borderRadius = '14px';
  img.style.display = 'block';

  imageActions.style.display = 'flex';

  let outer = null;
  try{
    const imageData = ctx.getImageData(0, 0, workCanvas.width, workCanvas.height);
    outer = await extractStealthPng(imageData, workCanvas.width, workCanvas.height);
  }catch(e){ /* fall through to the plain-chunk fallback below */ }

  if(!outer){
    try{
      const texts = parsePngTextChunks(arrayBuffer);
      if(texts.Comment){
        outer = { Comment: JSON.parse(texts.Comment), Source: texts.Source, Title: texts.Title };
      }
    }catch(e){ /* still nothing */ }
  }

  if(!outer || !outer.Comment || typeof outer.Comment === 'string'){
    setStatus('This doesn\'t seem like a NovelAI png. Only NAI PNGs are supported.', 'error');
    return;
  }

  const comment = outer.Comment;
  const fields = extractFields(comment);
  renderFields(fields, comment, outer);
  lastParsed = {comment, fields};
  setStatus('I found the metadata.', 'ok');
}

// erase = wipe the hidden alpha data + all text chunks (canvas re-encode drops them), then write the notice back:
// once into the stealth alpha layer, once as plain tEXt chunks. no metadata found -> plain wipe like before.
eraseBtn.addEventListener('click', async ()=>{
  if(!workCanvas.width) return;
  eraseBtn.disabled = true;
  try{
    const w = workCanvas.width, h = workCanvas.height;
    const imageData = ctx.getImageData(0, 0, w, h);
    const d = imageData.data;
    for(let i=3; i<d.length; i+=4) d[i] = 255;

    const notice = lastParsed ? buildNotice(lastParsed.comment, lastParsed.fields) : null;
    let stealthOk = true;
    if(notice){
      try{ await embedStealth(imageData, w, h, notice.outer); }
      catch(e){ stealthOk = false; }
    }
    ctx.putImageData(imageData, 0, 0);

    const blob = await new Promise(res => workCanvas.toBlob(res, 'image/png'));
    let bytes = new Uint8Array(await blob.arrayBuffer());
    if(notice) bytes = insertTextChunks(bytes, notice.textChunks);

    const url = URL.createObjectURL(new Blob([bytes], {type:'image/png'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFileBase + '_clean.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 5000);

    if(!notice) setStatus('Erased and ready to be downloaded.', 'ok');
    else if(stealthOk) setStatus('Erased. Every prompt line now holds a notice instead. Ready to be downloaded.', 'ok');
    else setStatus('Erased, with a text-only notice (this browser couldn\'t write the hidden-pixel one). Ready to be downloaded.', 'ok');
  }catch(e){
    setStatus('Something went wrong while erasing: ' + e.message, 'error');
  }finally{
    eraseBtn.disabled = false;
  }
});
</script>
